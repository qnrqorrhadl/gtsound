name: 윈도우 exe 빌드

on:
  workflow_dispatch:   # Actions 탭에서 "Run workflow" 버튼으로 직접 실행
  push:
    branches: [main]
    paths:
      - composer.py
      - requirements.txt
      - .github/workflows/build.yml

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: exe 만들기
        run: pyinstaller --onefile --windowed --name composer composer.py

      - name: exe 올리기
        uses: actions/upload-artifact@v4
        with:
          name: composer-windows
          path: dist/composer.exe
