name: 윈도우 exe 빌드와 배포

on:
  workflow_dispatch:   # Actions 탭에서 "Run workflow" 버튼으로 직접 실행
  push:
    branches: [main]
    paths:
      - composer.py
      - requirements.txt
      - .github/workflows/build.yml

permissions:
  contents: write      # Releases에 올리려면 필요해요

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 버전 번호 만들기
        run: Set-Content -Path version.txt -Value "${{ github.run_number }}" -NoNewline

      - name: exe 만들기
        run: pyinstaller --onefile --windowed --name composer --add-data "version.txt;." composer.py

      - name: 체크섬 만들기
        run: |
          $hash = (Get-FileHash dist/composer.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/composer.exe.sha256 -Value $hash -NoNewline

      - name: Releases에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ github.run_number }}"
          dist/composer.exe dist/composer.exe.sha256
          --title "v${{ github.run_number }}"
          --notes "자동 빌드 ${{ github.run_number }}번"
          --latest
